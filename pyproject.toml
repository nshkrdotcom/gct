[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geometry-conditional-truth"
version = "0.1.0"
description = "Falsifiable experiments on context transport in language-model activations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GCT contributors" }]
dependencies = [
  "huggingface-hub>=0.34,<2",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "torch==2.12.0",
  "transformers>=4.51,<6",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<4",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
gct = "gct.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gct"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: multi-module integration test",
  "real_model: requires the real Qwen checkpoint and a compatible CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["runs/"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*", "transformers.*"]
ignore_missing_imports = true
